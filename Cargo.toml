[package]
name = "qrcode2"
version = "0.17.2"
edition = "2024"
rust-version = "1.88.0"
description = "A QR code encoding library"
documentation = "https://docs.rs/qrcode2"
repository = "https://github.com/sorairolake/qrcode-rust2"
license = "Apache-2.0 OR MIT"
keywords = ["qrcode", "rmqr"]
categories = ["encoding", "multimedia::images", "no-std"]
include = ["/LICENSES", "/README.md", "/src"]

[[example]]
name = "encode_eps"
required-features = ["eps"]

[[example]]
name = "encode_image"
required-features = ["image"]

[[example]]
name = "encode_pic"
required-features = ["pic"]

[[example]]
name = "encode_svg"
required-features = ["svg"]

[dependencies]
csscolorparser = { version = "0.8.3", default-features = false, features = [
  "named-colors",
], optional = true }
image = { version = "0.25.10", default-features = false, optional = true }

[dev-dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
csscolorparser = "0.8.3"
image = "0.25.10"
sha3 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"

[features]
default = ["eps", "image", "pic", "std", "svg"]
eps = []
image = ["dep:image", "std"]
pic = []
std = ["csscolorparser?/std"]
svg = ["dep:csscolorparser"]

[lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
